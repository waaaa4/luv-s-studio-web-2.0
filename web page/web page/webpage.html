<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bring Club Vibes To Home - LUV'S STUDIO</title>
    <style>
        /* Shared Brand Styling */
        :root {
            --bg-dark: #09090e;
            --card-bg: #151520;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-green: #25D366;
            --neon-red: #ff3333;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --nav-height: 70px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-top: var(--nav-height); 
        }

        /* NEW: Multi-Page Navigation Bar */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* NEW: Highlighted Order Button */
        .order-btn-nav {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            color: white !important;
            text-decoration: none;
            padding: 10px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-btn-nav:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 240, 255, 0.6);
        }

        /* Page Content Styling */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: #000000;
            border-bottom: 2px solid var(--neon-pink);
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-align: center;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            color: var(--text-main);
            letter-spacing: 5px;
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Responsive Mobile Nav */
        @media (max-width: 900px) {
            .top-nav {
                flex-wrap: wrap;
                padding: 15px 20px;
                height: auto;
                justify-content: space-between;
            }
            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 15px;
                gap: 20px;
            }
            body {
                padding-top: 120px;
            }
            .hero h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Apple-Style Navigation Bar with Top Right Highlighted Order Button -->
    <nav class="top-nav">
        <div class="nav-brand">LUV'S STUDIO</div>
        <div class="nav-links">
            <!-- Notice how index.html has the "active" class here -->
            <a href="index.html" class="active">Details</a>
            <a href="why-us.html">Why Us</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <a href="pricing.html" class="order-btn-nav">ORDER NOW</a>
    </nav>

    <!-- Header Section -->
    <header>
        <h1 class="brand-title">LUV'S STUDIO</h1>
    </header>

    <!-- Details / Hero Section -->
    <main class="hero">
        <h2>Bring Club Vibes To Home</h2>
        <p>Smart, colorful, and limitless RGBIC controller kits designed to sync with your music and elevate your space. Powered by high-performance Wi-Fi and packed with premium preset patterns.</p>
    </main>

</body>
</html>
